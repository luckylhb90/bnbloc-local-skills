name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Local skills serve the sandbox, whose guest backend is macOS-only for
    # now (bnbloc docs/prd/2026-10-16-local-skills.md, "Not covered");
    # Linux keeps the code portable.
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 -short ./...
